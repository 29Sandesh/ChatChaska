name: Build ChatChaska Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://eyrbndkelwcrevreopjg.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_-ayIftovAKxi0Jt9oW24gA_xJiCCnxe' }}

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p out
          cp -r public/* out/ 2>/dev/null || true
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>ChatChaska POS</title>
            <script>window.location.href = 'https://chatchaska.vercel.app/staff/pos';</script>
          </head>
          <body style="margin:0; background:#020617; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; color:white;">
            <div style="text-align:center;">
              <h1 style="font-size:24px; font-weight:bold; margin-bottom:8px;">ChatChaska POS</h1>
              <p style="color:#94a3b8; font-size:14px;">Connecting to terminal...</p>
            </div>
          </body>
          </html>
          EOF
          npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatChaska-POS-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
